<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>Login | BRODA HUB</title>
<style>
:root{--bg:#090909;--panel:#111;--line:#303030;--white:#fff;--muted:#b5b5b5;--red:#c62828;--green:#16a34a;--orange:#f28c28}
*{box-sizing:border-box}
body{margin:0;padding:22px;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--white);line-height:1.5}
header{max-width:980px;margin:auto;padding:14px 0 20px;border-bottom:1px solid var(--line)}
.logo{font-size:22px;font-weight:800;letter-spacing:.4px}.logo span{color:var(--red)}
main{max-width:460px;margin:48px auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:clamp(20px,5vw,30px)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--orange)}
h1{font-size:30px;margin:8px 0}
p{color:var(--muted);line-height:1.65}
label{display:block;margin:18px 0 8px;font-size:14px;font-weight:600}
input{width:100%;padding:14px;background:#090909;border:1px solid #414141;border-radius:6px;color:#fff;font:inherit}
input:focus{outline:2px solid var(--red);outline-offset:1px}
button{width:100%;padding:14px;margin-top:24px;background:var(--red);color:#fff;border:0;border-radius:6px;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.65;cursor:wait}
.links{text-align:center;margin-top:22px;font-size:14px}.links a{color:var(--orange);text-decoration:none}
#message{overflow-wrap:anywhere;margin:18px 0 0;font-size:14px}
@media(max-width:480px){body{padding:14px}main{margin:28px auto}}
</style>
</head>
<body>
<header><a class="logo" href="index.html" style="color:#fff;text-decoration:none">BRODA <span>HUB</span></a></header>
<main>
  <div class="eyebrow">Member access</div>
  <h1>Welcome back</h1>
  <p>Log in to continue to your BRODA HUB account.</p>
  <form id="loginForm">
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Log In</button>
  </form>
  <p id="message" role="status" aria-live="polite"></p>
  <div class="links">Don't have an account? <a href="signup.html">Sign up</a><br><br><a href="index.html">Back to Home</a></div>
</main>
<script>
const form=document.getElementById("loginForm");
const message=document.getElementById("message");
form.addEventListener("submit",async e=>{
  e.preventDefault();
  const button=form.querySelector('button[type="submit"]');
  button.disabled=true;button.textContent="Signing in…";message.textContent="";
  try{
    const response=await fetch("https://broda-shop-b019.onrender.com/api/auth/login",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value})
    });
    const data=await response.json();
    if(!response.ok)throw new Error(data.error||data.message||"Login failed.");
    localStorage.setItem("brodaToken",data.token);
    localStorage.setItem("brodaUser",JSON.stringify(data.user));
    message.style.color="var(--green)";message.textContent="Login successful. Opening your dashboard…";
    window.location.href="dashboard.html";
  }catch(error){
    message.style.color="#ff8a8a";
    message.textContent=error.message==="Failed to fetch"?"Could not reach BRODA HUB. Please check your connection and try again.":error.message;
  }finally{button.disabled=false;button.textContent="Log In";}
});
</script>
</body>
</html>
