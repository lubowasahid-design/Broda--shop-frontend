

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | BRODA SHOP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #070b14;
      color: #f5f7fb;
      min-height: 100vh;
    }
    header {
      padding: 22px 6%;
      border-bottom: 1px solid #263246;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      background: #f2c94c;
      color: #070b14;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 24px;
      font-weight: 800;
    }
    header h2 { letter-spacing: 1px; }
    main {
      width: min(460px, 90%);
      margin: 65px auto;
    }
    .eyebrow {
      color: #f2c94c;
      font-size: 12px;
      letter-spacing: 3px;
      margin-bottom: 14px;
    }
    h1 { font-size: 32px; margin-bottom: 12px; }
    .intro {
      color: #9ba6b7;
      line-height: 1.7;
      margin-bottom: 30px;
    }
    label {
      display: block;
      margin: 18px 0 9px;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 16px;
      background: #101827;
      color: #f5f7fb;
      border: 1px solid #263246;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }
    input:focus { border-color: #f2c94c; }
    button {
      width: 100%;
      margin-top: 26px;
      padding: 17px;
      background: #f2c94c;
      color: #070b14;
      border: 0;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }
    .bottom {
      text-align: center;
      color: #9ba6b7;
      margin-top: 25px;
      line-height: 2;
    }
    a { color: #f2c94c; text-decoration: none; }
    .home { display: block; margin-top: 12px; }
    #message { margin-top: 18px; line-height: 1.6; }
  </style>
</head>
<body>
  <header>
    <div class="logo">B</div>
    <h2>BRODA SHOP</h2>
  </header>

  <main>
    <p class="eyebrow">JOIN OUR COMMUNITY</p>
    <h1>Create your account</h1>
    <p class="intro">
      Join Broda Shop to explore products, music promotions,
      videos, referrals and earning opportunities.
    </p>

    <form id="signupForm">
      <label for="name">Full name</label>
      <input id="name" name="name" type="text"
        placeholder="Enter your full name" required>

      <label for="email">Email address</label>
      <input id="email" name="email" type="email"
        placeholder="Enter your email" required>

      <label for="password">Create password</label>
      <input id="password" name="password" type="password"
        placeholder="At least 8 characters"
        minlength="8" required>

      <button type="submit">CREATE ACCOUNT</button>
      <p id="message" role="status"></p>
    </form>

    <div class="bottom">
      Already have an account?
      <a href="login.html">Log in</a>
      <a class="home" href="index.html">← Back to Broda Shop</a>
    </div>
  </main>

  <script>
    document.getElementById("signupForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();
        document.getElementById("message").textContent =
          "Your sign-up page is ready. Account creation will work once the secure backend is connected.";
      });
  </script>
</body>
</html>
