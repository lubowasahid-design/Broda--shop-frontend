<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>Create Account | BRODA HUB</title>
<style>
:root{--bg:#090909;--panel:#111;--line:#303030;--white:#fff;--muted:#b5b5b5;--red:#c62828;--green:#16a34a;--orange:#f28c28}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--white);line-height:1.5}
header{padding:20px 5%;border-bottom:1px solid var(--line)}
.logo{font-size:22px;font-weight:800;letter-spacing:.4px}.logo span{color:var(--red)}
main{width:min(460px,92%);margin:42px auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:clamp(20px,5vw,30px)}
.eyebrow{color:var(--orange);font-size:12px;font-weight:700;letter-spacing:1.5px;margin-bottom:8px}
h1{font-size:30px;margin:0 0 10px}.intro{color:var(--muted);line-height:1.65;margin:0 0 24px}
label{display:block;margin:18px 0 8px;font-size:14px;font-weight:600}
input{width:100%;padding:14px;background:#090909;color:#fff;border:1px solid #414141;border-radius:6px;font:inherit}
input:focus{outline:2px solid var(--red);outline-offset:1px}
button{width:100%;margin-top:24px;padding:15px;background:var(--red);color:#fff;border:0;border-radius:6px;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.65;cursor:wait}
.bottom{text-align:center;color:var(--muted);margin-top:22px;line-height:1.9;font-size:14px}
a{color:var(--orange);text-decoration:none}
#message{margin-top:16px;line-height:1.6;overflow-wrap:anywhere}
</style>
</head>
<body>
<header><a class="logo" href="index.html" style="color:#fff;text-decoration:none">BRODA <span>HUB</span></a></header>
<main>
  <p class="eyebrow">JOIN OUR COMMUNITY</p>
  <h1>Create your account</h1>
  <p class="intro">Join BRODA HUB to discover creators, music, videos, digital products and earning opportunities.</p>
  <form id="signupForm">
    <label for="name">Full name</label>
    <input id="name" name="name" type="text" autocomplete="name" placeholder="Enter your full name" required>
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" autocomplete="email" placeholder="Enter your email" required>
    <label for="password">Create password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
    <button type="submit">Create Account</button>
    <p id="message" role="status" aria-live="polite"></p>
  </form>
  <div class="bottom">Already have an account? <a href="login.html">Log in</a><br><a href="index.html">← Back to BRODA HUB</a></div>
</main>
<script>
const form=document.getElementById("signupForm");
const message=document.getElementById("message");
form.addEventListener("submit",async function(event){
  event.preventDefault();
  const button=form.querySelector('button[type="submit"]');
  const name=document.getElementById("name").value.trim();
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  button.disabled=true;button.textContent="Creating account…";message.textContent="";
  try{
    const response=await fetch("https://broda-shop-b019.onrender.com/api/auth/register",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name,email,password})
    });
    const data=await response.json();
    if(!response.ok)throw new Error(data.message||data.error||"Registration failed.");
    message.style.color="var(--green)";
    message.textContent="Account created. Taking you to login…";
    window.location.href="login.html?registered=1";
  }catch(error){
    message.style.color="#ff8a8a";
    message.textContent=error.message==="Failed to fetch"?"Could not reach BRODA HUB. Please check your connection and try again.":error.message;
  }finally{button.disabled=false;button.textContent="Create Account";}
});
</script>
</body>
</html>
