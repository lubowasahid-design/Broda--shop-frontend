
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Up | BRODA SHOP</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#070b14;color:#f5f7fb;min-height:100vh;padding:24px}
header{padding:15px 0 25px;border-bottom:1px solid #263246}
.logo{color:#f2c94c;font-size:24px;font-weight:bold}
main{max-width:460px;margin:45px auto}
h1{font-size:32px;margin-bottom:12px}
p{color:#9babba;line-height:1.6;margin-bottom:28px}
label{display:block;margin:18px 0 8px}
input{width:100%;padding:15px;background:#101827;border:1px solid #263246;border-radius:8px;color:white;font-size:16px}
button{width:100%;padding:16px;margin-top:25px;background:#f2c94c;border:0;border-radius:8px;font-size:17px;font-weight:bold;cursor:pointer}
a{color:#f2c94c;text-decoration:none}
.links{text-align:center;margin-top:24px}
</style>
</head>
<body>
<header><div class="logo">B · BRODA SHOP</div></header>
<main>
<h1>Create your account</h1>
<p>Join BRODA SHOP to discover digital content, promote products, support creators and explore earning opportunities.</p>

<form id="signupForm">
<label for="name">Full name</label>
<input id="name" name="name" autocomplete="name" required>

<label for="email">Email address</label>
<input id="email" name="email" type="email" autocomplete="email" required>

<label for="phone">Phone number</label>
<input id="phone" name="phone" type="tel" autocomplete="tel" required>

<label for="password">Create password</label>
<input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>

<label for="confirm">Confirm password</label>
<input id="confirm" name="confirm" type="password" minlength="8" autocomplete="new-password" required>

<button type="submit">Create Account</button>
</form>

<div class="links">
Already have an account? <a href="login.html">Log in</a>
<br><br><a href="index.html">Back to Home</a>
</div>
</main>
<script>
document.getElementById("signupForm").addEventListener("submit",function(e){
e.preventDefault();
if(document.getElementById("password").value !== document.getElementById("confirm").value){
alert("Passwords do not match.");
return;
}
alert("The signup page is ready. Account creation must be connected to the Broda Shop backend before registration can work.");
});
</script>
</body>
</html>
