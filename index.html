<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Broda Shop</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }
    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 30px; }
    header p { margin: 8px 0 0; }
    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }
    .welcome {
      background: white;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: center;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }
    .product {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    .product h3 { margin-top: 0; }
    .price {
      font-size: 20px;
      font-weight: bold;
      margin: 10px 0;
    }
    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #333; }
    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }
  </style>
</head>
<body>
<header>
  <h1>🛍️ BRODA SHOP</h1>
  <p>Welcome to Broda Shop</p>
</header>

<div class="container">
  <div class="welcome">
    <h2>Shop With Us</h2>
    <p>Quality products. Simple shopping. Great service.</p>
  </div>

  <div class="products">
    <div class="product">
      <h3>Product 1</h3>
      <p>Available product from Broda Shop.</p>
      <div class="price">UGX 10,000</div>
      <button onclick="order('Product 1')">Order Now</button>
    </div>

    <div class="product">
      <h3>Product 2</h3>
      <p>Available product from Broda Shop.</p>
      <div class="price">UGX 20,000</div>
      <button onclick="order('Product 2')">Order Now</button>
    </div>

    <div class="product">
      <h3>Product 3</h3>
      <p>Available product from Broda Shop.</p>
      <div class="price">UGX 30,000</div>
      <button onclick="order('Product 3')">Order Now</button>
    </div>
  </div>
</div>

<footer>© 2026 Broda Shop</footer>

<script>
  function order(product) {
    alert("You selected " + product + ". Broda Shop will process your order.");
  }
</script>
</body>
</html>
